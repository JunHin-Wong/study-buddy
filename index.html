<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time-Table-Study Buddy</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
    <h1>Study Buddy</h1>
    <a href="login.html" class="btn btn-primary">Log out</a>
    </div>
    <main class = "table-panel">
    <table class="session-table">
    <thead>
        <tr>
            <th>Subject</th>
            <th>Topic</th>
            <th>Date</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td><select>
            <option value="math">Math</option>
            <option value="science">Science</option>
            <option value="history">History</option>
            <option value="english">English</option>
            <option value="computer-science">Computer Science</option>
        </select></td>
            <td><select>
            <option value="math">Algebra</option>
            <option value="science">Biology</option>
            <option value="history">World War II</option>
            <option value="english">Fiction</option>
            <option value="computer-science">Programming</option>
        </select></td>
            <td><select>
                <option value="2024-06-01">2024-06-01</option>
                <option value="2024-06-02">2024-06-02</option>
                <option value="2024-06-03">2024-06-03</option>
                <option value="2024-06-04">2024-06-04</option>
                <option value="2024-06-05">2024-06-05</option>
            </select></td>
        </tr>
</table>
</main>
<main class="button">
<button class="btn btn-primary" type="submit">Add Study Session</button>
</main>
</body>
</html>
